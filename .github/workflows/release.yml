# Canonical copy. Install as .github/workflows/release.yml in RetroHero-App.
name: Release handhelds
run-name: "${{ inputs.publish && 'Release' || 'Verify' }} (${{ inputs.bump }})"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        type: choice
        required: true
        default: patch
        options: [patch, minor, major]
      publish:
        description: Publish the completed release (disable for build verification)
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: handheld-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_TOOLCHAIN: '1.94.1'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: CreatonDevelopment/RetroHero
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          ref: main
          persist-credentials: false
      - name: Resolve source revision, version, and unique build targets
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/release.py plan --bump "${{ inputs.bump }}"

  test:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: CreatonDevelopment/RetroHero
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: handheld-tests
          cache-on-failure: true
          cache-bin: false
      - name: Test release tools and firmware adapters
        run: |
          python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
          cargo test --locked --no-default-features --features trimui

  build:
    needs: prepare
    name: Build ${{ matrix.backend }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      RUSTFLAGS: -C target-cpu=${{ matrix.cpu }}
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.tools/zig-cache
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: CreatonDevelopment/RetroHero
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/ci/requirements.txt
      - name: Install pinned compiler tools
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "${{ matrix.target }}"
          python3 -m pip install --disable-pip-version-check -r scripts/ci/requirements.txt
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: release-${{ matrix.backend }}-${{ matrix.target }}-zig-0.16.0
          cache-on-failure: true
          cache-bin: false
          cache-directories: .tools/zig-cache
      - name: Stamp release version in the temporary source checkout
        run: python3 scripts/ci/release.py stamp --version "${{ needs.prepare.outputs.version }}"
      - name: Build optimized static firmware binary
        run: bash scripts/ci/build.sh "${{ matrix.backend }}" "${{ matrix.target }}" "${{ matrix.zig_target }}" "${{ matrix.cpu }}"
      - name: Smoke-test the target executable (native ARM64; emulated ARMv7)
        run: |
          if [ '${{ matrix.arch }}' = aarch64 ]; then
            "target/${{ matrix.target }}/release/retrohero" --list-devices
          else
            sudo apt-get update -qq
            sudo apt-get install --no-install-recommends -y qemu-user
            qemu-arm "target/${{ matrix.target }}/release/retrohero" --list-devices
          fi
      - name: Package every matching device and firmware
        run: python3 scripts/ci/release.py package --backend "${{ matrix.backend }}" --arch "${{ matrix.arch }}" --version "${{ needs.prepare.outputs.version }}" --sha "${{ needs.prepare.outputs.source_sha }}"
      - name: Verify application replacement and restart
        run: python3 scripts/ci/smoke-update.py --backend "${{ matrix.backend }}" --arch "${{ matrix.arch }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.backend }}-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    needs: [prepare, test, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: CreatonDevelopment/RetroHero
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - name: Verify the complete package set and publish atomically
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          args=()
          if [ "$PUBLISH" = true ]; then args+=(--release); fi
          python3 scripts/ci/release.py publish --version "${{ needs.prepare.outputs.version }}" --sha "${{ needs.prepare.outputs.source_sha }}" "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-metadata
          path: |
            dist/SHA256SUMS
            dist/release-manifest.json
            dist/release-notes.md
          if-no-files-found: error
